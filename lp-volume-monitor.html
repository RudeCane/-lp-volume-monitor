<index.html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LP Volume Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050608;
  --bg2: #080a0e;
  --panel: #0c0f15;
  --panel2: #10141d;
  --border: #1a2235;
  --border2: #232f45;
  --amber: #f5a623;
  --amber2: #ff6b00;
  --green: #00e676;
  --red: #ff1744;
  --blue: #00b0ff;
  --cyan: #18ffff;
  --purple: #d500f9;
  --muted: #3d5070;
  --text: #c8d8f0;
  --text2: #7a99c0;
  --mono: 'IBM Plex Mono', monospace;
  --display: 'Barlow Condensed', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  min-height:100vh;
  overflow-x:hidden;
}

/* scanlines */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
  pointer-events:none;
  z-index:9999;
}

/* grid bg */
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(245,166,35,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,166,35,0.025) 1px, transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
  z-index:0;
}

.app{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding:0 20px 80px;}

/* ─── HEADER ─────────────────────────────── */
.header{
  display:flex;
  align-items:stretch;
  justify-content:space-between;
  padding:18px 0;
  border-bottom:1px solid var(--border);
  margin-bottom:20px;
  gap:24px;
}
.header-left{display:flex;flex-direction:column;justify-content:center;gap:4px;}
.brand{
  font-family:var(--display);
  font-size:2.4rem;
  font-weight:800;
  letter-spacing:4px;
  line-height:1;
  color:var(--amber);
  text-shadow:0 0 30px rgba(245,166,35,0.4);
}
.brand span{color:var(--text2);}
.tagline{
  font-size:0.58rem;
  letter-spacing:3px;
  color:var(--muted);
  text-transform:uppercase;
}

.header-stats{
  display:flex;
  gap:1px;
  align-items:stretch;
}
.hstat{
  background:var(--panel);
  border:1px solid var(--border);
  padding:10px 20px;
  text-align:center;
  min-width:130px;
}
.hstat-label{font-size:0.55rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.hstat-val{font-size:1.4rem;font-weight:700;line-height:1;}
.hstat-val.amber{color:var(--amber);}
.hstat-val.green{color:var(--green);}
.hstat-val.blue{color:var(--blue);}
.hstat-val.cyan{color:var(--cyan);}
.hstat-sub{font-size:0.6rem;color:var(--muted);margin-top:3px;}

.header-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px;}
.live-row{display:flex;align-items:center;gap:8px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.live-txt{font-size:0.62rem;letter-spacing:2px;color:var(--green);}
.refresh-btn{
  background:none;border:1px solid var(--border2);color:var(--text2);
  font-family:var(--mono);font-size:0.62rem;letter-spacing:1px;
  padding:5px 14px;cursor:pointer;transition:all .15s;
}
.refresh-btn:hover{border-color:var(--amber);color:var(--amber);}
.ts{font-size:0.58rem;color:var(--muted);}

/* ─── DEX TABS ──────────────────────────── */
.dex-tabs{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  margin-bottom:16px;
  padding-bottom:16px;
  border-bottom:1px solid var(--border);
}
.dex-tab{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:10px 18px;
  background:var(--panel);
  border:1px solid var(--border);
  cursor:pointer;
  transition:all .15s;
  position:relative;
  min-width:110px;
}
.dex-tab:hover{border-color:var(--border2);}
.dex-tab.active{
  border-color:var(--amber);
  background:rgba(245,166,35,0.06);
}
.dex-tab.active::after{
  content:'';
  position:absolute;
  bottom:-1px;left:0;right:0;
  height:2px;
  background:var(--amber);
}
.dex-tab-icon{font-size:1.3rem;line-height:1;}
.dex-tab-name{font-size:0.65rem;letter-spacing:1.5px;font-weight:600;color:var(--text);}
.dex-tab.active .dex-tab-name{color:var(--amber);}
.dex-tab-chain{font-size:0.55rem;color:var(--muted);letter-spacing:1px;}
.dex-tab-vol{font-size:0.6rem;color:var(--green);font-weight:600;}
.dex-tab-status{
  position:absolute;
  top:6px;right:6px;
  width:5px;height:5px;
  border-radius:50%;
}
.dex-tab-status.ok{background:var(--green);}
.dex-tab-status.loading{background:var(--amber);animation:blink 1s infinite;}
.dex-tab-status.error{background:var(--red);}

/* ALL tab */
.dex-tab.all-tab{
  background:linear-gradient(135deg,rgba(245,166,35,0.08),rgba(0,176,255,0.08));
  border-color:var(--border2);
}
.dex-tab.all-tab.active{border-color:var(--cyan);}
.dex-tab.all-tab.active::after{background:var(--cyan);}
.dex-tab.all-tab.active .dex-tab-name{color:var(--cyan);}

/* ─── FILTERS ROW ───────────────────────── */
.filters{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.search{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--mono);
  font-size:0.72rem;
  padding:7px 14px;
  width:240px;
  outline:none;
  transition:border-color .15s;
}
.search:focus{border-color:var(--amber);}
.search::placeholder{color:var(--muted);}

.fgroup{display:flex;align-items:center;gap:6px;}
.flabel{font-size:0.55rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.fselect{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--mono);
  font-size:0.68rem;
  padding:7px 10px;
  outline:none;
  cursor:pointer;
}
.fselect option{background:var(--panel2);}

.time-btns{display:flex;border:1px solid var(--border);overflow:hidden;}
.time-btn{
  padding:6px 14px;
  background:none;border:none;
  font-family:var(--mono);font-size:0.65rem;letter-spacing:1px;
  color:var(--muted);cursor:pointer;transition:all .15s;
  border-right:1px solid var(--border);
}
.time-btn:last-child{border-right:none;}
.time-btn:hover{color:var(--text);background:var(--panel2);}
.time-btn.active{background:var(--amber);color:#000;font-weight:700;}

.min-vol-wrap{display:flex;align-items:center;gap:8px;}
.range-input{accent-color:var(--amber);cursor:pointer;width:100px;}
.range-val{font-size:0.65rem;color:var(--amber);min-width:65px;}

.results-count{
  margin-left:auto;
  font-size:0.62rem;
  color:var(--muted);
  letter-spacing:1px;
}

/* ─── TABLE ─────────────────────────────── */
.table-container{
  background:var(--panel);
  border:1px solid var(--border);
  overflow:hidden;
}
.table-header-row{
  background:var(--bg2);
  border-bottom:2px solid var(--border2);
  display:flex;
  align-items:center;
  padding:0 16px;
}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--bg2);border-bottom:2px solid var(--border2);}
th{
  padding:11px 12px;
  font-size:0.55rem;
  letter-spacing:2px;
  color:var(--muted);
  text-transform:uppercase;
  text-align:left;
  cursor:pointer;
  white-space:nowrap;
  user-select:none;
  border-right:1px solid rgba(26,34,53,0.5);
}
th:last-child{border-right:none;}
th:hover{color:var(--amber);}
th.sorted{color:var(--amber);}
.sort-ico{margin-left:4px;opacity:0.5;}

tbody tr{
  border-bottom:1px solid rgba(26,34,53,0.7);
  transition:background .08s;
}
tbody tr:hover{background:rgba(245,166,35,0.03);cursor:pointer;}
tbody tr:last-child{border-bottom:none;}
td{
  padding:10px 12px;
  font-size:0.78rem;
  vertical-align:middle;
  white-space:nowrap;
  border-right:1px solid rgba(26,34,53,0.3);
}
td:last-child{border-right:none;}

/* Pool cell */
.pool-cell{display:flex;align-items:center;gap:10px;min-width:180px;}
.pool-logo{
  width:30px;height:30px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:0.7rem;flex-shrink:0;
}
.pool-name-main{font-size:0.82rem;font-weight:600;color:var(--text);letter-spacing:.5px;}
.pool-addr{font-size:0.58rem;color:var(--muted);margin-top:1px;}

/* DEX badge */
.dex-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 9px;border-radius:2px;
  font-size:0.58rem;letter-spacing:1.5px;font-weight:700;border:1px solid;
  white-space:nowrap;
}
.dex-uni-v2{color:#ff007a;border-color:rgba(255,0,122,0.3);background:rgba(255,0,122,0.07);}
.dex-uni-v3{color:#ff6da0;border-color:rgba(255,109,160,0.3);background:rgba(255,109,160,0.07);}
.dex-uni-v4{color:#ffb3cc;border-color:rgba(255,179,204,0.25);background:rgba(255,179,204,0.06);}
.dex-cake-v2{color:var(--amber);border-color:rgba(245,166,35,0.3);background:rgba(245,166,35,0.07);}
.dex-cake-v3{color:#ffcc44;border-color:rgba(255,204,68,0.3);background:rgba(255,204,68,0.07);}
.dex-cake-v4{color:#ffe088;border-color:rgba(255,224,136,0.25);background:rgba(255,224,136,0.06);}
.dex-meteora{color:var(--blue);border-color:rgba(0,176,255,0.3);background:rgba(0,176,255,0.07);}
.dex-meteora-dlmm{color:#44d4ff;border-color:rgba(68,212,255,0.3);background:rgba(68,212,255,0.07);}
.dex-orca{color:var(--cyan);border-color:rgba(24,255,255,0.3);background:rgba(24,255,255,0.07);}
.dex-jito{color:var(--purple);border-color:rgba(213,0,249,0.3);background:rgba(213,0,249,0.07);}

/* Chain badge */
.chain-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:2px;
  font-size:0.56rem;letter-spacing:1.5px;font-weight:700;border:1px solid;
}
.chain-eth{color:#a78bfa;border-color:rgba(167,139,250,0.3);background:rgba(167,139,250,0.07);}
.chain-bsc{color:#f5c518;border-color:rgba(245,197,24,0.3);background:rgba(245,197,24,0.07);}
.chain-sol{color:#9945ff;border-color:rgba(153,69,255,0.3);background:rgba(153,69,255,0.07);}
.chain-base{color:#0ea5e9;border-color:rgba(14,165,233,0.3);background:rgba(14,165,233,0.07);}

/* Volume cells */
.vol-cell{text-align:right;}
.vol-val{font-size:0.82rem;font-weight:600;}
.vol-bar{
  height:2px;margin-top:3px;border-radius:1px;
  background:linear-gradient(90deg,var(--amber),var(--amber2));
  transition:width .3s;
}

/* Numbers */
.num{font-variant-numeric:tabular-nums;}
.green{color:var(--green);}
.red{color:var(--red);}
.amber{color:var(--amber);}
.blue{color:var(--blue);}
.cyan{color:var(--cyan);}
.muted{color:var(--muted);}

/* Fee APR */
.apr-wrap{display:flex;flex-direction:column;gap:2px;}
.apr-val{font-weight:700;font-size:0.82rem;}
.apr-bar{height:3px;border-radius:2px;margin-top:2px;max-width:80px;}

/* Txn cell */
.txn-cell{display:flex;flex-direction:column;gap:2px;}
.txn-buys{font-size:0.7rem;color:var(--green);}
.txn-sells{font-size:0.7rem;color:var(--red);}

/* Ratio */
.ratio-pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;font-size:0.65rem;font-weight:700;
  border-radius:2px;
}
.ratio-high{background:rgba(0,230,118,0.1);color:var(--green);border:1px solid rgba(0,230,118,0.2);}
.ratio-med{background:rgba(245,166,35,0.1);color:var(--amber);border:1px solid rgba(245,166,35,0.2);}
.ratio-low{background:rgba(26,34,53,0.8);color:var(--muted);border:1px solid var(--border);}

/* Loading / error / empty */
.state-box{text-align:center;padding:70px 40px;}
.spinner{
  width:40px;height:40px;
  border:2px solid var(--border2);
  border-top-color:var(--amber);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 18px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.state-txt{font-size:0.68rem;letter-spacing:2px;color:var(--muted);}
.state-dex-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;}
.state-dex-item{
  font-size:0.6rem;letter-spacing:1px;color:var(--muted);
  background:var(--panel2);border:1px solid var(--border);
  padding:4px 10px;
}
.state-dex-item.done{color:var(--green);border-color:rgba(0,230,118,0.3);}
.state-dex-item.loading{color:var(--amber);border-color:rgba(245,166,35,0.3);animation:blink 1s infinite;}
.state-dex-item.error{color:var(--red);border-color:rgba(255,23,68,0.3);}

/* Pagination */
.pagination{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  border-top:1px solid var(--border);
  background:var(--bg2);
}
.pg-info{font-size:0.62rem;color:var(--muted);}
.pg-btns{display:flex;gap:6px;}
.pg-btn{
  padding:5px 14px;background:var(--panel);
  border:1px solid var(--border);color:var(--text2);
  font-family:var(--mono);font-size:0.62rem;cursor:pointer;transition:all .15s;
}
.pg-btn:hover:not(:disabled){border-color:var(--amber);color:var(--amber);}
.pg-btn:disabled{opacity:.3;cursor:not-allowed;}

/* Rank */
.rank{
  width:24px;height:24px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:0.62rem;font-weight:700;
}
.rank-1{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;}
.rank-2{background:linear-gradient(135deg,#c0c0c0,#808080);color:#000;}
.rank-3{background:linear-gradient(135deg,#cd7f32,#8b4513);color:#fff;}
.rank-n{background:var(--panel2);color:var(--muted);border:1px solid var(--border);}

/* Fee tier tag */
.fee-tag{
  display:inline-block;padding:2px 7px;
  font-size:0.6rem;letter-spacing:1px;font-weight:600;
  background:var(--panel2);border:1px solid var(--border2);
  color:var(--text2);border-radius:2px;
}

/* Tooltip helper */
.tooltip{position:relative;}
.tooltip:hover::after{
  content:attr(data-tip);
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--border2);
  color:var(--text);font-size:0.6rem;padding:4px 10px;
  white-space:nowrap;pointer-events:none;z-index:100;
}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="brand">LP<span>VOL</span>SCAN</div>
      <div class="tagline">Uniswap · PancakeSwap · Meteora · Orca · Jito — Volume Intelligence</div>
    </div>
    <div class="header-stats">
      <div class="hstat">
        <div class="hstat-label">Pools Loaded</div>
        <div class="hstat-val amber" id="hPools">—</div>
        <div class="hstat-sub">across all DEXs</div>
      </div>
      <div class="hstat">
        <div class="hstat-label">Top 24H Vol</div>
        <div class="hstat-val green num" id="hTopVol">—</div>
        <div class="hstat-sub" id="hTopVolPool">loading…</div>
      </div>
      <div class="hstat">
        <div class="hstat-label">Total Vol (24H)</div>
        <div class="hstat-val cyan num" id="hTotalVol">—</div>
        <div class="hstat-sub">filtered pools</div>
      </div>
      <div class="hstat">
        <div class="hstat-label">Avg Fee APR</div>
        <div class="hstat-val blue num" id="hAvgApr">—</div>
        <div class="hstat-sub">top 50 pools</div>
      </div>
    </div>
    <div class="header-right">
      <div class="live-row">
        <div class="live-dot"></div>
        <span class="live-txt">LIVE</span>
      </div>
      <div class="ts" id="ts">—</div>
      <button class="refresh-btn" onclick="init()">↻ REFRESH</button>
    </div>
  </div>

  <!-- DEX TABS -->
  <div class="dex-tabs" id="dexTabs">
    <div class="dex-tab all-tab active" data-dex="all" onclick="setDex('all')">
      <div class="dex-tab-icon">◈</div>
      <div class="dex-tab-name">ALL DEXS</div>
      <div class="dex-tab-chain">9 protocols</div>
      <div class="dex-tab-vol" id="tab-vol-all">—</div>
    </div>
    <!-- dynamically populated -->
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <input class="search" type="text" id="searchInput" placeholder="⌕  search pair, token, address…">
    <div class="fgroup">
      <span class="flabel">Sort</span>
      <select class="fselect" id="sortSel">
        <option value="vol24">↓ 24H Volume</option>
        <option value="vol1h">↓ 1H Volume</option>
        <option value="vol6h">↓ 6H Volume</option>
        <option value="liq">↓ Liquidity</option>
        <option value="apr">↓ Fee APR</option>
        <option value="ratio">↓ Vol/Liq Ratio</option>
        <option value="txns">↓ Transactions</option>
        <option value="pchg">↓ 24H Price Chg</option>
      </select>
    </div>
    <div class="fgroup">
      <span class="flabel">Time</span>
      <div class="time-btns">
        <button class="time-btn active" data-t="h24" onclick="setTime('h24')">24H</button>
        <button class="time-btn" data-t="h6" onclick="setTime('h6')">6H</button>
        <button class="time-btn" data-t="h1" onclick="setTime('h1')">1H</button>
      </div>
    </div>
    <div class="fgroup min-vol-wrap">
      <span class="flabel">Min Vol</span>
      <input class="range-input" type="range" id="minVolRange" min="0" max="7" step="1" value="2" oninput="onVolRange(this.value)">
      <span class="range-val" id="minVolLabel">$50K</span>
    </div>
    <span class="results-count" id="resultCount">— pools</span>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <div id="tableWrap">
      <div class="state-box">
        <div class="spinner"></div>
        <div class="state-txt">SCANNING DEX POOLS…</div>
        <div class="state-dex-list" id="loadingList"></div>
      </div>
    </div>
  </div>

</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────
const DEX_CONFIGS = [
  { id:'uni-v2',  name:'Uniswap V2',       short:'UNI V2',  chain:'eth',    network:'eth',    dex:'uniswap_v2',     icon:'🦄', badgeCls:'dex-uni-v2',  chainCls:'chain-eth', chainLabel:'ETH',  feeDefault:0.003 },
  { id:'uni-v3',  name:'Uniswap V3',       short:'UNI V3',  chain:'eth',    network:'eth',    dex:'uniswap_v3',     icon:'🦄', badgeCls:'dex-uni-v3',  chainCls:'chain-eth', chainLabel:'ETH',  feeDefault:null  },
  { id:'uni-v4',  name:'Uniswap V4',       short:'UNI V4',  chain:'eth',    network:'eth',    dex:'uniswap_v4',     icon:'🦄', badgeCls:'dex-uni-v4',  chainCls:'chain-eth', chainLabel:'ETH',  feeDefault:null  },
  { id:'cake-v2', name:'PancakeSwap V2',   short:'CAKE V2', chain:'bsc',    network:'bsc',    dex:'pancakeswap_v2', icon:'🥞', badgeCls:'dex-cake-v2', chainCls:'chain-bsc', chainLabel:'BNB',  feeDefault:0.0025},
  { id:'cake-v3', name:'PancakeSwap V3',   short:'CAKE V3', chain:'bsc',    network:'bsc',    dex:'pancakeswap_v3', icon:'🥞', badgeCls:'dex-cake-v3', chainCls:'chain-bsc', chainLabel:'BNB',  feeDefault:null  },
  { id:'cake-v4', name:'PancakeSwap V4',   short:'CAKE V4', chain:'bsc',    network:'bsc',    dex:'pancakeswap-v4', icon:'🥞', badgeCls:'dex-cake-v4', chainCls:'chain-bsc', chainLabel:'BNB',  feeDefault:null  },
  { id:'meteora', name:'Meteora',          short:'METEOR',  chain:'sol',    network:'solana', dex:'meteora',        icon:'☄️', badgeCls:'dex-meteora', chainCls:'chain-sol', chainLabel:'SOL',  feeDefault:0.002 },
  { id:'orca',    name:'Orca',             short:'ORCA',    chain:'sol',    network:'solana', dex:'orca',           icon:'🐋', badgeCls:'dex-orca',    chainCls:'chain-sol', chainLabel:'SOL',  feeDefault:0.003 },
  { id:'jito',    name:'Jito',             short:'JITO',    chain:'sol',    network:'solana', dex:'jito',           icon:'⚡', badgeCls:'dex-jito',    chainCls:'chain-sol', chainLabel:'SOL',  feeDefault:0.003 },
];

const VOL_THRESHOLDS = [0, 5000, 50000, 100000, 500000, 1000000, 5000000, 10000000];
const VOL_LABELS     = ['$0','$5K','$50K','$100K','$500K','$1M','$5M','$10M'];

let allPools = [];
let dexStatus = {}; // id -> 'loading'|'ok'|'error'
let dexVolumes = {}; // id -> totalVol24h
let currentDex = 'all';
let currentTime = 'h24';
let currentSort = 'vol24';
let currentSearch = '';
let minVol = 50000;
let currentPage = 1;
const PAGE = 50;

// ── UTILS ────────────────────────────────────────────────────────────────
function fmt$(n){
  if(!n || isNaN(n)) return '—';
  if(Math.abs(n)>=1e9) return '$'+(n/1e9).toFixed(2)+'B';
  if(Math.abs(n)>=1e6) return '$'+(n/1e6).toFixed(2)+'M';
  if(Math.abs(n)>=1e3) return '$'+(n/1e3).toFixed(1)+'K';
  return '$'+n.toFixed(0);
}
function fmtPct(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const s=n>0?'+':'';
  const c=n>0?'green':n<0?'red':'muted';
  return `<span class="${c}">${s}${n.toFixed(2)}%</span>`;
}
function fmtApr(n){
  if(!n||isNaN(n)) return '—';
  if(n>=1000) return (n/1000).toFixed(1)+'K%';
  return n.toFixed(1)+'%';
}
function fmtNum(n){
  if(!n||isNaN(n)) return '—';
  return n.toLocaleString();
}
function shortenAddr(s){
  if(!s||s.length<12) return s||'';
  return s.slice(0,6)+'…'+s.slice(-4);
}
function aprColor(n){
  if(n>200) return 'var(--green)';
  if(n>50)  return 'var(--amber)';
  return 'var(--blue)';
}

function getVol(pool){
  if(currentTime==='h24') return pool.vol24||0;
  if(currentTime==='h6')  return pool.vol6h||0;
  if(currentTime==='h1')  return pool.vol1h||0;
  return pool.vol24||0;
}

// ── FETCH ────────────────────────────────────────────────────────────────
async function fetchDex(cfg){
  const url = `https://api.geckoterminal.com/api/v2/networks/${cfg.network}/dexes/${cfg.dex}/pools?sort=h24_volume_usd_liquidity_desc&page=1`;
  const res = await fetch(url, { headers: {'Accept':'application/json'} });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  return (json.data||[]).map(p => normPool(p, cfg));
}

function normPool(p, cfg){
  const a = p.attributes||{};
  const vusd = a.volume_usd||{};
  const txns = a.transactions||{};
  const pchg = a.price_change_percentage||{};
  const liq  = parseFloat(a.reserve_in_usd)||0;
  const v24  = parseFloat(vusd.h24)||0;
  const v6   = parseFloat(vusd.h6)||0;
  const v1   = parseFloat(vusd.h1)||0;

  // Fee tier from name or default
  let feeRate = cfg.feeDefault;
  const nameUpper = (a.name||'').toUpperCase();
  if(nameUpper.includes('0.01%')||nameUpper.includes('100')) feeRate=0.0001;
  else if(nameUpper.includes('0.05%')||nameUpper.includes('500')) feeRate=0.0005;
  else if(nameUpper.includes('0.3%')||nameUpper.includes('3000')) feeRate=0.003;
  else if(nameUpper.includes('1%')||nameUpper.includes('10000')) feeRate=0.01;
  if(!feeRate) feeRate=0.003;

  const fee = a.pool_fee ? parseFloat(a.pool_fee)/100 : feeRate;
  const apr = liq>0 ? (v24 * fee * 365 / liq * 100) : 0;
  const ratio = liq>0 ? v24/liq : 0;

  const t24 = txns.h24||{};
  const buys  = (t24.buys||0);
  const sells = (t24.sells||0);

  const addr = (p.id||'').split('_').pop();

  return {
    id: p.id,
    addr,
    name: a.name||'Unknown',
    dexId: cfg.id,
    dexName: cfg.short,
    dexBadge: cfg.badgeCls,
    dexIcon: cfg.icon,
    chain: cfg.chainLabel,
    chainCls: cfg.chainCls,
    liq,
    vol24: v24,
    vol6h: v6,
    vol1h: v1,
    buys,
    sells,
    txns24: buys+sells,
    pchg24: parseFloat(pchg.h24)||0,
    pchg1h: parseFloat(pchg.h1)||0,
    fee,
    apr,
    ratio,
    basePrice: a.base_token_price_usd,
    url: `https://www.geckoterminal.com/${cfg.network}/pools/${addr}`,
  };
}

// ── INIT ─────────────────────────────────────────────────────────────────
async function init(){
  allPools = [];
  dexStatus = {};
  dexVolumes = {};
  currentPage = 1;

  document.getElementById('hPools').textContent='—';
  document.getElementById('hTopVol').textContent='—';
  document.getElementById('hTotalVol').textContent='—';
  document.getElementById('hAvgApr').textContent='—';

  // Show loading
  const ll = document.getElementById('loadingList');
  ll.innerHTML = DEX_CONFIGS.map(d=>
    `<span class="state-dex-item loading" id="ldex-${d.id}">${d.icon} ${d.short}</span>`
  ).join('');
  document.getElementById('tableWrap').innerHTML=`
    <div class="state-box">
      <div class="spinner"></div>
      <div class="state-txt">SCANNING ALL DEX POOLS…</div>
      <div class="state-dex-list" id="loadingList">
        ${DEX_CONFIGS.map(d=>`<span class="state-dex-item loading" id="ldex-${d.id}">${d.icon} ${d.short}</span>`).join('')}
      </div>
    </div>`;

  // Fetch all DEXs in parallel
  const fetches = DEX_CONFIGS.map(async cfg => {
    try{
      const pools = await fetchDex(cfg);
      dexStatus[cfg.id]='ok';
      const vol = pools.reduce((a,b)=>a+(b.vol24||0),0);
      dexVolumes[cfg.id]=vol;
      allPools.push(...pools);
      setItemStatus(cfg.id,'done', pools.length);
      updateHeaderStats();
      applyFiltersAndRender();
    } catch(e){
      dexStatus[cfg.id]='error';
      setItemStatus(cfg.id,'error',0);
    }
  });
  await Promise.allSettled(fetches);
  document.getElementById('ts').textContent='Updated '+new Date().toLocaleTimeString();
  buildDexTabs();
  applyFiltersAndRender();
}

function setItemStatus(id, state, count){
  const el = document.getElementById(`ldex-${id}`);
  if(el){
    el.className=`state-dex-item ${state}`;
    const cfg=DEX_CONFIGS.find(d=>d.id===id);
    el.textContent=`${cfg.icon} ${cfg.short} ${state==='done'?'('+count+')':state==='error'?'✗':''}`;
  }
}

function buildDexTabs(){
  const container = document.getElementById('dexTabs');
  let allVol=0;
  allPools.forEach(p=>allVol+=p.vol24||0);
  document.getElementById('tab-vol-all').textContent=fmt$(allVol);

  // Remove existing dex-specific tabs
  container.querySelectorAll(':not(.all-tab)').forEach(el=>el.remove());

  DEX_CONFIGS.forEach(cfg=>{
    const vol = dexVolumes[cfg.id]||0;
    const cnt = allPools.filter(p=>p.dexId===cfg.id).length;
    const status = dexStatus[cfg.id]||'loading';
    const tab = document.createElement('div');
    tab.className='dex-tab'+(currentDex===cfg.id?' active':'');
    tab.dataset.dex=cfg.id;
    tab.onclick=()=>setDex(cfg.id);
    tab.innerHTML=`
      <div class="dex-tab-status ${status==='ok'?'ok':status==='error'?'error':'loading'}"></div>
      <div class="dex-tab-icon">${cfg.icon}</div>
      <div class="dex-tab-name">${cfg.short}</div>
      <div class="dex-tab-chain">${cfg.chainLabel} · ${cnt} pools</div>
      <div class="dex-tab-vol">${status==='error'?'<span style="color:var(--red);font-size:.55rem">NO DATA</span>':fmt$(vol)}</div>
    `;
    container.appendChild(tab);
  });
}

// ── FILTERS ──────────────────────────────────────────────────────────────
function applyFiltersAndRender(){
  let pools=[...allPools];

  if(currentDex!=='all') pools=pools.filter(p=>p.dexId===currentDex);

  const vol=getVolField();
  pools=pools.filter(p=>(p[vol]||0)>=minVol);

  if(currentSearch){
    const q=currentSearch.toLowerCase();
    pools=pools.filter(p=>
      p.name.toLowerCase().includes(q)||
      p.dexName.toLowerCase().includes(q)||
      p.chain.toLowerCase().includes(q)||
      p.addr.toLowerCase().includes(q)
    );
  }

  // Sort
  pools.sort((a,b)=>{
    if(currentSort==='vol24') return (b.vol24||0)-(a.vol24||0);
    if(currentSort==='vol1h') return (b.vol1h||0)-(a.vol1h||0);
    if(currentSort==='vol6h') return (b.vol6h||0)-(a.vol6h||0);
    if(currentSort==='liq')   return (b.liq||0)-(a.liq||0);
    if(currentSort==='apr')   return (b.apr||0)-(a.apr||0);
    if(currentSort==='ratio') return (b.ratio||0)-(a.ratio||0);
    if(currentSort==='txns')  return (b.txns24||0)-(a.txns24||0);
    if(currentSort==='pchg')  return (b.pchg24||0)-(a.pchg24||0);
    return 0;
  });

  document.getElementById('resultCount').textContent=`${pools.length} pools`;
  renderTable(pools);
  updateHeaderStats(pools);
}

function getVolField(){
  if(currentTime==='h24') return 'vol24';
  if(currentTime==='h6')  return 'vol6h';
  if(currentTime==='h1')  return 'vol1h';
  return 'vol24';
}

function updateHeaderStats(pools){
  const src = pools || allPools;
  if(!src.length) return;
  document.getElementById('hPools').textContent=allPools.length.toLocaleString();
  const sorted=[...src].sort((a,b)=>(b.vol24||0)-(a.vol24||0));
  const top=sorted[0];
  if(top){
    document.getElementById('hTopVol').textContent=fmt$(top.vol24);
    document.getElementById('hTopVolPool').textContent=top.name.slice(0,22);
  }
  const totalVol=src.reduce((a,b)=>a+(b.vol24||0),0);
  document.getElementById('hTotalVol').textContent=fmt$(totalVol);
  const topAprs=src.filter(p=>p.apr>0).slice(0,50).map(p=>p.apr);
  const avgApr=topAprs.length?topAprs.reduce((a,b)=>a+b,0)/topAprs.length:0;
  document.getElementById('hAvgApr').textContent=fmtApr(avgApr);
}

// ── RENDER TABLE ─────────────────────────────────────────────────────────
function renderTable(pools){
  const start=(currentPage-1)*PAGE;
  const page=pools.slice(start,start+PAGE);
  const total=Math.ceil(pools.length/PAGE);

  if(!page.length){
    document.getElementById('tableWrap').innerHTML=`<div class="state-box"><div class="state-txt">NO POOLS MATCH YOUR FILTERS</div></div>`;
    return;
  }

  const volField=getVolField();
  const maxVol=Math.max(...page.map(p=>p[volField]||0),1);
  const maxLiq=Math.max(...page.map(p=>p.liq||0),1);

  const timeLabel=currentTime==='h24'?'24H':currentTime==='h6'?'6H':'1H';

  const rows=page.map((pool,i)=>{
    const rank=start+i+1;
    const rankHtml=rank===1?`<span class="rank rank-1">1</span>`:rank===2?`<span class="rank rank-2">2</span>`:rank===3?`<span class="rank rank-3">3</span>`:`<span class="rank rank-n">${rank}</span>`;

    const vol=pool[volField]||0;
    const barW=Math.max(2,Math.round(vol/maxVol*100));
    const liqBarW=Math.max(2,Math.round((pool.liq||0)/maxLiq*100));

    let ratioCls='ratio-low', ratioLabel='LOW';
    if(pool.ratio>=2){ratioCls='ratio-high';ratioLabel='HIGH';}
    else if(pool.ratio>=0.5){ratioCls='ratio-med';ratioLabel='MED';}

    const feePct=pool.fee?(pool.fee*100).toFixed(2)+'%':'—';

    const aprV=pool.apr||0;
    const aprW=Math.min(100,Math.round(aprV/500*100));
    const aprC=aprColor(aprV);

    const poolInitials=(pool.name||'??').split('/')[0].trim().slice(0,3).toUpperCase();

    const logoGrad=pool.chain==='ETH'?'linear-gradient(135deg,#627eea,#9945ff)':
                  pool.chain==='BNB'?'linear-gradient(135deg,#f0b90b,#ff6b00)':
                  'linear-gradient(135deg,#9945ff,#14f195)';

    return `
    <tr onclick="window.open('${pool.url}','_blank')">
      <td style="padding-left:16px;width:48px">${rankHtml}</td>
      <td>
        <div class="pool-cell">
          <div class="pool-logo" style="background:${logoGrad}">${poolInitials}</div>
          <div>
            <div class="pool-name-main">${pool.name}</div>
            <div class="pool-addr">${shortenAddr(pool.addr)}</div>
          </div>
        </div>
      </td>
      <td><span class="dex-badge ${pool.dexBadge}">${pool.dexIcon} ${pool.dexName}</span></td>
      <td><span class="chain-badge ${pool.chainCls}">${pool.chain}</span></td>
      <td class="vol-cell">
        <div class="vol-val amber num">${fmt$(vol)}</div>
        <div class="vol-bar" style="width:${barW}%"></div>
      </td>
      <td class="vol-cell">
        <div style="font-size:.75rem" class="num muted">${fmt$(pool.vol1h)}</div>
      </td>
      <td class="vol-cell">
        <div style="font-size:.75rem" class="num muted">${fmt$(pool.vol6h)}</div>
      </td>
      <td class="vol-cell">
        <div style="font-size:.75rem" class="num">${fmt$(pool.liq)}</div>
        <div class="vol-bar" style="width:${liqBarW}%;background:linear-gradient(90deg,var(--blue),var(--cyan))"></div>
      </td>
      <td>
        <div class="apr-wrap">
          <span class="apr-val" style="color:${aprC}">${fmtApr(aprV)}</span>
          <div class="apr-bar" style="background:${aprC};width:${aprW}%;opacity:.4"></div>
        </div>
      </td>
      <td>
        <div class="txn-cell">
          <span class="txn-buys">▲ ${fmtNum(pool.buys)}</span>
          <span class="txn-sells">▼ ${fmtNum(pool.sells)}</span>
        </div>
      </td>
      <td>${fmtPct(pool.pchg24)}</td>
      <td><span class="ratio-pill ${ratioCls}">${pool.ratio.toFixed(2)}x</span></td>
      <td><span class="fee-tag">${feePct}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('tableWrap').innerHTML=`
    <table>
      <thead>
        <tr>
          <th style="width:48px">#</th>
          <th>POOL PAIR</th>
          <th>DEX</th>
          <th>CHAIN</th>
          <th class="${currentSort==='vol24'?'sorted':''}" onclick="setSort('vol24')">${timeLabel} VOL<span class="sort-ico">↕</span></th>
          <th class="${currentSort==='vol1h'?'sorted':''}" onclick="setSort('vol1h')">1H VOL<span class="sort-ico">↕</span></th>
          <th class="${currentSort==='vol6h'?'sorted':''}" onclick="setSort('vol6h')">6H VOL<span class="sort-ico">↕</span></th>
          <th class="${currentSort==='liq'?'sorted':''}" onclick="setSort('liq')">LIQUIDITY<span class="sort-ico">↕</span></th>
          <th class="${currentSort==='apr'?'sorted':''}" onclick="setSort('apr')">FEE APR<span class="sort-ico">↕</span></th>
          <th class="${currentSort==='txns'?'sorted':''}" onclick="setSort('txns')">TXNS 24H<span class="sort-ico">↕</span></th>
          <th class="${currentSort==='pchg'?'sorted':''}" onclick="setSort('pchg')">24H Δ<span class="sort-ico">↕</span></th>
          <th class="${currentSort==='ratio'?'sorted':''}" onclick="setSort('ratio')">VOL/LIQ<span class="sort-ico">↕</span></th>
          <th>FEE TIER</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="pagination">
      <span class="pg-info">Showing ${start+1}–${Math.min(start+PAGE,pools.length)} of ${pools.length} pools · page ${currentPage}/${total||1}</span>
      <div class="pg-btns">
        <button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage<=1?'disabled':''}>← PREV</button>
        <button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=total?'disabled':''}>NEXT →</button>
      </div>
    </div>`;
}

// ── CONTROLS ─────────────────────────────────────────────────────────────
function setDex(id){
  currentDex=id; currentPage=1;
  document.querySelectorAll('.dex-tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.dex===id);
  });
  applyFiltersAndRender();
}
function setTime(t){
  currentTime=t; currentPage=1;
  document.querySelectorAll('.time-btn').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  applyFiltersAndRender();
}
function setSort(s){
  currentSort=s;
  document.getElementById('sortSel').value=s==='vol24'?'vol24':s==='liq'?'liq':s==='apr'?'apr':s==='ratio'?'ratio':s==='txns'?'txns':s==='pchg'?'pchg':s;
  currentPage=1;
  applyFiltersAndRender();
}
function onVolRange(v){
  minVol=VOL_THRESHOLDS[parseInt(v)];
  document.getElementById('minVolLabel').textContent=VOL_LABELS[parseInt(v)];
  currentPage=1;
  applyFiltersAndRender();
}
function goPage(p){ currentPage=p; applyFiltersAndRender(); window.scrollTo({top:0,behavior:'smooth'}); }

document.getElementById('searchInput').addEventListener('input',e=>{
  currentSearch=e.target.value; currentPage=1; applyFiltersAndRender();
});
document.getElementById('sortSel').addEventListener('change',e=>setSort(e.target.value));

// Auto-refresh every 2 minutes
setInterval(()=>{
  if(document.visibilityState==='visible') init();
}, 120000);

init();
</script>
</body>
</html>
